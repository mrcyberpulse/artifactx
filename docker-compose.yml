version: "3.8"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: artifactx
      POSTGRES_PASSWORD: artifactx
      POSTGRES_DB: artifactx
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - ARTIFACTX_DATABASE_URL=postgresql+psycopg://artifactx:artifactx@db:5432/artifactx
      - ARTIFACTX_REDIS_URL=redis://redis:6379/0
      - ARTIFACTX_SECRET_KEY=super-secret-key-at-least-32-chars-long
    depends_on: [db, redis]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
