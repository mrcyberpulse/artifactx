name: artifactx

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artifactx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-artifactx}
    volumes:
      - artifactx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artifactx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artifactx_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - artifactx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artifactx_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ARTIFACTX_ENVIRONMENT: ${ARTIFACTX_ENVIRONMENT:-production}
      ARTIFACTX_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-artifactx}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@postgres:5432/${POSTGRES_DB:-artifactx}
      ARTIFACTX_REDIS_URL: redis://redis:6379/0
      ARTIFACTX_SECRET_KEY: ${ARTIFACTX_SECRET_KEY:?Set ARTIFACTX_SECRET_KEY in your .env file}
      ARTIFACTX_COOKIE_SECURE: ${ARTIFACTX_COOKIE_SECURE:-true}
      ARTIFACTX_CORS_ORIGINS: ${ARTIFACTX_CORS_ORIGINS:-}
      ARTIFACTX_FRONTEND_URL: ${ARTIFACTX_FRONTEND_URL:-http://localhost:8080}
      ARTIFACTX_DOCS_ENABLED: ${ARTIFACTX_DOCS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - artifactx_internal
      - artifactx_public

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${ARTIFACTX_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - artifactx_public

networks:
  artifactx_internal:
    internal: true
  artifactx_public:

volumes:
  artifactx_postgres_data:
  artifactx_redis_data:
